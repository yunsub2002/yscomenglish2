label.f{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.ans{display:none;margin-top:8px}.ans.on{display:block}

a{color:var(--acc)}

</head>

 ${DB.exp.filter(e=>(e.date||"").startsWith(M.month)).map(e=>`<div class="stu"><div class="li"><b>${esc(e.cat)} · ${won(e.amount)}</b><span>${e.date} ${esc(e.memo||"")}</span></div><button class="sb d" data-m="delExp" data-id="${e.id}">✕</button></div>`).join("")}</div>
 <div class="card"><h3>📅 ${y}년 월별 손익</h3><div class="tw"><table><tr><th>월</th><th>청구</th><th>수납</th><th>지출</th><th>순이익</th></tr>${Array.from({length:12},(_,i)=>{const mo=y+"-"+String(i+1).padStart(2,"0"),r=monthFin(mo);return r.billed||r.exp?`<tr><td>${i+1}월</td><td>${won(r.billed)}</td><td>${won(r.paid)}</td><td>${won(r.exp)}</td><td><b>${won(r.net)}</b></td></tr>`:""}).join("")||`<tr><td colspan="5" class="mut">기록 없음</td></tr>`}</table></div></div>`};
MV.cur=()=>{const rows=DB.cur.filter(c=>c.cls==M.cc).sort((a,b)=>(a.date||"").localeCompare(b.date||""));const dn=rows.filter(r=>r.done).length;
 return `<div class="chips">${CLS.map(c=>`<button class="chip${M.cc==c?" on":""}" data-m="f" data-k="cc" data-v="${c}">${c}반</button>`).join("")}</div>
 <div class="card"><h3>${M.cc}반 진도 ${dn}/${rows.length}</h3><div class="bar"><i style="width:${rows.length?dn/rows.length*100:0}%"></i></div>
 <div class="row"><input type="date" id="c_start" value="${today()}" style="max-width:180px"><button class="btn" data-m="gen">${M.arm=="gen"?"기존 계획에 추가됩니다 · 한 번 더":"12주 기본 커리큘럼 생성"}</button></div>
 <div class="mini" style="margin-top:4px">Foundation = A 문법 → B 구문 / Standard = B 구문 → C 유형 → D 서술형 / Advanced = C 유형 → D 서술형 → F 실전 (주 2강)</div>
 ${rows.map((r,i)=>`<div class="stu"><input type="checkbox" data-m-cur="${r.id}"${r.done?" checked":""} style="width:18px;height:18px;accent-color:var(--acc)"><div class="li"><b>${i+1}주차 · ${r.date||""}</b><span style="white-space:normal">${esc(r.topic)}</span><span>과제: ${esc(r.hw||"-")} · 테스트: ${esc(r.test||"-")}</span></div><button class="sb d" data-m="delCur" data-id="${r.id}">✕</button></div>`).join("")}</div>
 <div class="card"><h3>➕ 수업 추가</h3><div class="fm"><div><label>날짜</label><input type="date" id="c_date" value="${today()}"></div><div><label>강좌에서 선택</label><select id="c_pick"><option value="">직접 입력</option>${LECS.map(l=>`<option>${esc(l)}</option>`).join("")}</select></div>
 <div class="full"><label>진도 내용</label><input type="text" id="c_topic" placeholder="비우면 위에서 선택한 강좌가 들어갑니다"></div><div><label>과제</label><input type="text" id="c_hw"></div><div><label>테스트</label><input type="text" id="c_test"></div></div><button class="btn g w" data-m="addCur" style="margin-top:8px">추가</button></div>`};
MV.data=()=>`<div class="card"><h3>💾 백업 · 복원</h3><div class="sm">모든 학원 데이터는 <b>이 컴퓨터의 이 브라우저</b>에만 저장됩니다. 브라우저 기록·쿠키를 지우면 사라지므로 <b>주 1회 백업 파일을 이 폴더에 저장</b>하세요.</div>
 <div class="row" style="margin-top:10px"><button class="btn" data-m="export">백업 파일 받기 (JSON)</button><button class="btn g" data-m="import">백업 불러오기</button><input type="file" id="m_file" accept=".json" style="display:none"></div>
 <div class="row" style="margin-top:8px"><button class="btn g" data-m="csv">수강생 명단 엑셀(CSV)</button><button class="btn g" data-m="csvpay">수납 내역 엑셀(CSV)</button></div></div>
 <div class="card"><h3>🧪 체험용</h3><div class="sm mut">가상 학생 8명·출결·수납·지출이 들어갑니다. 실제 운영 전에 '전체 초기화'로 지우세요.</div><div class="row" style="margin-top:8px"><button class="btn g" data-m="sample">샘플 데이터 넣기</button><button class="sb d" data-m="reset">${M.arm=="reset"?"정말 초기화? 한 번 더 누르세요":"전체 초기화"}</button></div></div>
 <div class="card"><h3>현재 데이터</h3><div class="sm">수강생 ${DB.students.length}명 · 출결 ${Object.keys(DB.att).length}일 · 수납 ${DB.pay.length}건 · 지출 ${DB.exp.length}건 · 커리큘럼 ${DB.cur.length}회</div></div>`;

function dl(name,text,type){const b=new Blob([text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvq=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
function genCur(cls,start){const map={Foundation:["A","B"],Standard:["B","C","D"],Advanced:["C","D","F"]}[cls];const L=[];COURSES.filter(c=>map.includes(c[0])).forEach(c=>c[4].forEach(l=>L.push(c[0]+" · "+l)));
 const d0=new Date(start+"T00:00:00");for(let w=0;w<12&&w*2<L.length;w++){const d=new Date(d0);d.setDate(d.getDate()+7*w);const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
 DB.cur.push({id:uid(),cls,date:ds,topic:L.slice(w*2,w*2+2).join(" / "),hw:"어휘 Day "+(w*2+1)+"~"+(w*2+2)+" + 복습 문제",test:w%4==3?"월간 실전 모의":"주간 테스트(문법20+서술형5)",done:false})}}
function sample(){const nm=["샘플A","샘플B","샘플C","샘플D","샘플E","샘플F","샘플G","샘플H"],mo=today().slice(0,7);
 nm.forEach((n,i)=>{const s={id:uid(),name:n+" (가상)",school:SCH[i%2],grade:GRADES[i%3],cls:CLS[i%3],phone:"010-0000-000"+i,pphone:"010-1111-000"+i,fee:[300000,350000,400000][i%3],start:mo+"-01",status:i==7?"휴원":"재원",memo:"체험용 가상 학생",scores:[{date:mo+"-05",kind:"학원 테스트",val:(70+i*3)+"점"}]};DB.students.push(s);
  for(let d=1;d<=Math.min(+today().slice(8),28);d+=3){const ds=mo+"-"+String(d).padStart(2,"0");DB.att[ds]=DB.att[ds]||{};DB.att[ds][s.id]=(i+d)%11==0?"X":(i+d)%7==0?"L":"O"}
  if(s.status=="재원")DB.pay.push({id:uid(),sid:s.id,month:mo,amount:s.fee,paid:i%3!=1,date:i%3!=1?mo+"-05":""})});
 DB.exp.push({id:uid(),date:mo+"-01",cat:"임대료",amount:1500000,memo:"체험용"},{id:uid(),date:mo+"-10",cat:"교재·인쇄",amount:180000,memo:"체험용"})}

function mAct(a,b){const id=b.dataset.id;if(a!="delStu"&&a!="reset"&&a!="gen")M.arm="";
 switch(a){
 case "sub":M.sub=b.dataset.v;M.edit=null;M.rep=null;break;
 case "f":M[b.dataset.k]=b.dataset.v;break;
 case "new":M.edit="new";break;case "edit":M.edit=id;M.rep=null;break;case "cancel":M.edit=null;M.rep=null;break;case "rep":M.rep=id;M.edit=null;break;
 case "saveStu":{const g=k=>$("#f_"+k).value.trim();if(!g("name")){$("#f_name").focus();return}
  const o={name:g("name"),school:g("school"),grade:g("grade"),cls:g("cls"),phone:g("phone"),pphone:g("pphone"),fee:+g("fee")||0,start:g("start"),status:g("status"),memo:$("#f_memo").value};
  if(M.edit=="new"){o.id=uid();o.scores=[];DB.students.push(o)}else Object.assign(stu(M.edit),o);M.edit=null;dbs();break}
 case "delStu":if(M.arm!="s"+id){M.arm="s"+id;break}DB.students=DB.students.filter(s=>s.id!=id);DB.pay=DB.pay.filter(p=>p.sid!=id);M.edit=null;M.arm="";dbs();break;
 case "addScore":{const v=$("#sc_val").value.trim();if(!v)return;const s=stu(M.rep);(s.scores=s.scores||[]).push({date:$("#sc_date").value,kind:$("#sc_kind").value,val:v});dbs();break}
 case "delScore":stu(M.rep).scores.splice(+b.dataset.i,1);dbs();break;
 case "att":{const d=DB.att[M.date]=DB.att[M.date]||{};if(d[id]==b.dataset.v)delete d[id];else d[id]=b.dataset.v;dbs();break}
 case "attAll":{const d=DB.att[M.date]=DB.att[M.date]||{};DB.students.filter(s=>s.status=="재원"&&(M.fc=="전체"||s.cls==M.fc)).forEach(s=>{if(!d[s.id])d[s.id]="O"});dbs();break}
 case "bill":DB.students.filter(s=>s.status=="재원").forEach(s=>{if(!DB.pay.some(p=>p.sid==s.id&&p.month==M.month))DB.pay.push({id:uid(),sid:s.id,month:M.month,amount:s.fee,paid:false,date:""})});dbs();break;
 case "paid":{const p=DB.pay.find(x=>x.id==id);p.paid=!p.paid;p.date=p.paid?today():"";dbs();break}
 case "delPay":DB.pay=DB.pay.filter(p=>p.id!=id);dbs();break;
 case "addExp":{const amt=+$("#e_amt").value;if(!amt)return;DB.exp.push({id:uid(),date:$("#e_date").value,cat:$("#e_cat").value,amount:amt,memo:$("#e_memo").value});dbs();break}
 case "delExp":DB.exp=DB.exp.filter(e=>e.id!=id);dbs();break;
 case "gen":{const st=$("#c_start").value||today();if(DB.cur.some(c=>c.cls==M.cc)&&M.arm!="gen"){M.arm="gen";break}M.arm="";genCur(M.cc,st);dbs();break}
 case "addCur":{const t=$("#c_topic").value.trim()||$("#c_pick").value;if(!t)return;DB.cur.push({id:uid(),cls:M.cc,date:$("#c_date").value,topic:t,hw:$("#c_hw").value,test:$("#c_test").value,done:false});dbs();break}
 case "delCur":DB.cur=DB.cur.filter(c=>c.id!=id);dbs();break;
 case "export":dl("학원데이터_백업_"+today()+".json",JSON.stringify(DB,null,1),"application/json");return;
 case "import":$("#m_file").click();return;
 case "csv":dl("수강생명단_"+today()+".csv","﻿"+[["이름","학교","학년","반","상태","월수강료","학생연락처","학부모연락처","등록일","메모"].map(csvq).join(",")].concat(DB.students.map(s=>[s.name,s.school,s.grade,s.cls,s.status,s.fee,s.phone,s.pphone,s.start,s.memo].map(csvq).join(","))).join("\r\n"),"text/csv");return;
 case "csvpay":dl("수납내역_"+today()+".csv","﻿"+[["월","이름","금액","상태","수납일"].map(csvq).join(",")].concat(DB.pay.map(p=>{const s=stu(p.sid);return [p.month,s?s.name:"",p.amount,p.paid?"완납":"미납",p.date].map(csvq).join(",")})).join("\r\n"),"text/csv");return;
 case "sample":sample();dbs();break;
 case "reset":if(M.arm!="reset"){M.arm="reset";break}DB={students:[],att:{},pay:[],exp:[],cur:[]};M.arm="";dbs();break;
 }
 const y=scrollY;render();scrollTo(0,y)}

function render(){hdr();$("#app").innerHTML=V[S.tab]();save()}

/* ===================== 이벤트 ===================== */
document.addEventListener("click",e=>{const b=e.target.closest("button,[data-ck]");if(!b)return;
 if(b.dataset.m){mAct(b.dataset.m,b);return}
 if(b.dataset.ps!=null){const [i,o]=b.dataset.ps.split("_").map(Number);if(PS[i]==null){PS[i]=o;const y=scrollY;render();scrollTo(0,y)}return}
 if(b.dataset.t){S.tab=b.dataset.t;render();scrollTo(0,0)}
 else if(b.dataset.g){S.grade=b.dataset.g;render()}
 else if(b.dataset.s){S.school=b.dataset.s;render()}
 else if(b.dataset.rev){$("#"+b.dataset.rev).classList.toggle("on")}
 else if(b.dataset.u){Q.unit=b.dataset.u;newQuiz();render()}
 else if(b.dataset.o!=null&&Q.pick==null){Q.pick=+b.dataset.o;if(Q.pick==QB[Q.set[Q.i]][3])Q.score++;render()}
 else if(b.dataset.q=="next"){Q.i++;Q.pick=null;render()}
 else if(b.dataset.q=="again"){newQuiz();render()}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.mc){M[t.dataset.mc]=t.value||M[t.dataset.mc];render();return}
 if(t.dataset.mCur){const r=DB.cur.find(x=>x.id==t.dataset.mCur);r.done=t.checked;dbs();render();return}
 if(t.id=="m_file"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.students)throw 0;DB={students:[],att:{},pay:[],exp:[],cur:[],...d};dbs();render();$("#app").insertAdjacentHTML("afterbegin",'<div class="sw"><b>복원 완료</b> 수강생 '+DB.students.length+'명</div>')}catch(x){$("#app").insertAdjacentHTML("afterbegin",'<div class="trap"><b>복원 실패</b> 올바른 백업 파일이 아닙니다.</div>')}};fr.readAsText(t.files[0]);return}
 const c=t.dataset.ck;if(c){done[c]=e.target.checked;save();document.querySelectorAll('[data-ck="'+c+'"]').forEach(x=>{x.checked=e.target.checked;x.closest(".chk").classList.toggle("d",e.target.checked)})}});
document.addEventListener("input",e=>{if(e.target.hasAttribute("data-mq")){M.q=e.target.value;$("#mlist").innerHTML=stuList();return}const a=e.target.dataset.an;if(a){const[k,f]=a.split("|");const o=LS.get(k,{});o[f]=e.target.value;LS.set(k,o)}});
$("#thm").onclick=()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=cur=="dark"?"light":"dark";LS.set("theme",r.dataset.theme)};
{const t=LS.get("theme",null);if(t)document.documentElement.dataset.theme=t}
render();
</script>
</body>
</html>
